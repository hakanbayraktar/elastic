# ==============================================================================
# LAB-11 SIEM hatti
#   input  : Filebeat (Beats protokolu, 5044) -> host /var/log/auth.log
#   filter : syslog govdesini ayristir -> guvenlik olayini SINIFLANDIR (ECS)
#   output : siem-auth-* index'i
#
# Fark: LAB-06 "ham satiri alana cevirmeyi" ogretir. Burada alanlara cevirmek
# yetmez; her satirin NE OLDUGUNA karar verip (event.action/outcome) guvenlik
# sorulariyla sorgulanabilir hale getiriyoruz.
# ==============================================================================

input {
  beats {
    id => "beats_auth_logs"
    port => 5044
  }
}

filter {
  # Filebeat container'inin kendi host/agent bilgisi olaya karismasin: host.name satirdaki sunucu adindan gelir.
  mutate { remove_field => ["host", "agent", "ecs", "input"] }
  # --------------------------------------------------------------------------
  # 1) Syslog iskeleti: zaman damgasi, host, surec adi/pid ve geri kalan govde.
  #    Ubuntu 24.04 RFC3339 zaman damgasi kullanir:
  #    2026-11-12T19:08:07.327466+03:00 student102 sshd[65483]: Failed password ...
  # --------------------------------------------------------------------------
  grok {
    id => "grok_syslog_header"
    match => {
      "message" => "^%{TIMESTAMP_ISO8601:[event][created]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[log][detail]}$"
    }
    tag_on_failure => ["_syslog_header_failure"]
  }

  # systemd-logind satirlari ("New session 167 of user student", "Removed
  # session 167") pam_unix'in zaten kaydettigi oturum olaylarinin ikinci bir
  # kopyasidir. SIEM'de mukerrer kayit hem depolama maliyeti hem de yanlis
  # sayim demektir; kaynakta dusuruyoruz.
  if [process][name] == "systemd-logind" {
    drop { }
  }

  if "_syslog_header_failure" not in [tags] {

    date {
      id => "date_event_created"
      match => [ "[event][created]", "ISO8601" ]
      target => "@timestamp"
      remove_field => [ "[event][created]" ]
    }

    # ------------------------------------------------------------------------
    # 2) SINIFLANDIRMA: her desen bir guvenlik olayina karsilik gelir.
    #    event.action  -> ne oldu
    #    event.outcome -> sonuc (success / failure)  <- tespit kurallari buna bakar
    #    user.name / source.ip -> kim, nereden        <- korelasyon bunlara dayanir
    # ------------------------------------------------------------------------
    if [log][detail] =~ /^Failed password/ {
      grok {
        id => "grok_ssh_failed"
        match => { "[log][detail]" => "^Failed password for (?:invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int}" }
        tag_on_failure => ["_ssh_failed_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "ssh_login_failed"
          "[event][outcome]"  => "failure"
          "[event][category]" => "authentication"
        }
      }
    } else if [log][detail] =~ /^Accepted / {
      grok {
        id => "grok_ssh_accepted"
        match => { "[log][detail]" => "^Accepted %{WORD:[authentication][method]} for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int}" }
        tag_on_failure => ["_ssh_accepted_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "ssh_login_success"
          "[event][outcome]"  => "success"
          "[event][category]" => "authentication"
        }
      }
    } else if [log][detail] =~ /authentication failure/ {
      # PAM katmanindaki kimlik dogrulama hatasi. sshd'nin "Failed password"
      # satirinin ikizi degildir: parola denemesine hic gelmeyen (tty, su,
      # sudo) hatalari da buraya duser.
      grok {
        id => "grok_pam_auth_failure"
        match => { "[log][detail]" => "rhost=%{IP:[source][ip]}(?:\s+user=%{USERNAME:[user][name]})?" }
        tag_on_failure => ["_pam_auth_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "auth_failure"
          "[event][outcome]"  => "failure"
          "[event][category]" => "authentication"
        }
      }
    } else if [log][detail] =~ /^(Connection closed|Connection reset|Disconnected from|Received disconnect)/ {
      # Brute force araclari parola denemesini yarida kesip baglantiyi kapatir.
      # Tek basina zararsiz, ama ayni IP'den yuzlercesi acik bir tarama izidir.
      grok {
        id => "grok_connection_aborted"
        match => { "[log][detail]" => "(?:invalid user %{USERNAME:[user][name]} |authenticating user %{USERNAME:[user][name]} |user %{USERNAME:[user][name]} )?%{IP:[source][ip]} port %{POSINT:[source][port]:int}" }
        tag_on_failure => ["_connection_aborted_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "connection_aborted"
          "[event][outcome]"  => "failure"
          "[event][category]" => "network"
        }
      }
    } else if [log][detail] =~ /^Invalid user/ {
      grok {
        id => "grok_invalid_user"
        match => { "[log][detail]" => "^Invalid user %{USERNAME:[user][name]} from %{IP:[source][ip]}" }
        tag_on_failure => ["_invalid_user_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "ssh_invalid_user"
          "[event][outcome]"  => "failure"
          "[event][category]" => "authentication"
        }
      }
    } else if [log][detail] =~ /COMMAND=/ {
      grok {
        id => "grok_sudo_command"
        match => { "[log][detail]" => "^\s*%{USERNAME:[user][name]} : .*COMMAND=%{GREEDYDATA:[process][command_line]}$" }
        tag_on_failure => ["_sudo_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "sudo_command"
          "[event][outcome]"  => "success"
          "[event][category]" => "process"
        }
      }
    } else if [log][detail] =~ /new user: name=/ {
      grok {
        id => "grok_user_created"
        match => { "[log][detail]" => "new user: name=%{USERNAME:[user][name]}" }
        tag_on_failure => ["_useradd_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "user_created"
          "[event][outcome]"  => "success"
          "[event][category]" => "iam"
        }
      }
    } else if [log][detail] =~ /session opened for user/ {
      grok {
        id => "grok_session_opened"
        match => { "[log][detail]" => "session opened for user %{USERNAME:[user][name]}" }
        tag_on_failure => ["_session_open_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "session_opened"
          "[event][outcome]"  => "success"
          "[event][category]" => "session"
        }
      }
    } else if [log][detail] =~ /session closed for user/ {
      grok {
        id => "grok_session_closed"
        match => { "[log][detail]" => "session closed for user %{USERNAME:[user][name]}" }
        tag_on_failure => ["_session_close_unparsed"]
      }
      mutate {
        add_field => {
          "[event][action]"   => "session_closed"
          "[event][outcome]"  => "success"
          "[event][category]" => "session"
        }
      }
    } else {
      # Siniflandirilamayan satir SILINMEZ: SIEM'de "bilinmeyen" de bir sinyaldir.
      mutate {
        add_field => {
          "[event][action]"   => "uncategorized"
          "[event][category]" => "other"
        }
      }
    }

    mutate {
      id => "normalize_siem_fields"
      add_field => {
        "[event][kind]"    => "event"
        "[event][dataset]" => "siem.auth"
      }
    }
  }
}

output {
  elasticsearch {
    id => "es_out_siem"
    hosts => ["${ES_HOST}"]
    index => "siem-auth-%{+YYYY.MM.dd}"
    user => "${ES_USER}"
    password => "${ELASTIC_PASSWORD}"
  }
}
