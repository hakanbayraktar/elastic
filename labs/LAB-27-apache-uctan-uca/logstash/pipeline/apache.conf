input {
  beats { port => 5044 ecs_compatibility => v8 }
}

filter {
  if [fields][dataset] == "apache.access" {
    grok {
      match => {
        "message" => '^%{IP:[apache][remote_ip]} %{NOTSPACE:[apache][xff_ip]} %{NOTSPACE:[http][request][id]} %{NOTSPACE:apache.ident} %{NOTSPACE:apache.auth_user} \[%{HTTPDATE:[apache][timestamp]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]} (?:%{INT:[http][response][body][bytes]}|-) %{NUMBER:[apache][duration_us]} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"$'
      }
      tag_on_failure => ["_apache_access_grok_failure"]
    }

    if "_apache_access_grok_failure" not in [tags] {
      ruby {
        code => "require 'uri'; original = event.get('[url][original]'); event.set('[url][path]', URI.parse(original).path) if original"
      }
      if [apache][xff_ip] != "-" {
        mutate { rename => { "[apache][xff_ip]" => "[source][ip]" } }
      } else {
        mutate { rename => { "[apache][remote_ip]" => "[source][ip]" } }
      }
      mutate {
        rename => { "[apache][remote_ip]" => "[source][nat][ip]" }
        add_field => { "[event][dataset]" => "apache.access" "[event][module]" => "apache" }
        convert => {
          "[http][response][status_code]" => "integer"
          "[http][response][body][bytes]" => "integer"
          "[apache][duration_us]" => "float"
        }
      }
      date {
        match => ["[apache][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
        timezone => "UTC"
        tag_on_failure => ["_apache_date_failure"]
      }
      ruby {
        code => "duration_us = event.get('[apache][duration_us]'); event.set('[event][duration]', (duration_us.to_f * 1000).round) if duration_us"
      }
    }
  } else if [fields][dataset] == "apache.error" {
    mutate { add_field => { "[event][dataset]" => "apache.error" "[event][module]" => "apache" } }
  } else if [fields][source_component] == "traffic-generator" {
    mutate { add_field => { "[event][module]" => "apache" } }
  } else {
    mutate { add_tag => ["_apache_unknown_source"] }
  }

  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source]"
      ecs_compatibility => v8
      tag_on_failure => ["_apache_geoip_unresolved"]
    }
  }

  mutate {
    add_field => { "[labels][training_lab]" => "apache-web-observability" }
    remove_field => ["[apache][timestamp]", "[apache][duration_us]", "[apache][xff_ip]", "[agent][ephemeral_id]"]
  }
}

output {
  if "_apache_unknown_source" not in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch-lab00:9200}"]
      user => "${ELASTIC_USER:elastic}"
      password => "${ELASTIC_PASSWORD:DevOps2026!}"
      index => "apache-web-%{+yyyy.MM.dd}"
      manage_template => false
      ecs_compatibility => v8
    }
  }
  stdout { codec => dots }
}
