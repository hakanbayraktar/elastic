ServerName apache
ExtendedStatus On

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

LogFormat "%a %{X-Forwarded-For}i %{X-Request-ID}i %l %u %t \"%m %U%q %H\" %>s %B %D \"%{Referer}i\" \"%{User-Agent}i\"" apache_training
CustomLog "/usr/local/apache2/logs/access_log" apache_training
ErrorLog "/usr/local/apache2/logs/error_log"
LogLevel warn

<Directory "/usr/local/apache2/cgi-bin">
    Options +ExecCGI -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>
