input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/mysql-connector-j-8.4.0.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql-magaza-lab:3306/magaza?connectionTimeZone=UTC"
    jdbc_user => "${DB_USER}"
    jdbc_password => "${DB_PASSWORD}"
    # Uc tablo tek sorguda birlesir: her satir aramaya hazir bir siparis belgesi olur.
    statement => "
      SELECT s.id AS siparis_id, s.adet, s.durum, s.guncellendi,
             m.ad AS musteri, m.il, u.ad AS urun, u.kategori, u.fiyat,
             s.adet * u.fiyat AS tutar
      FROM siparisler s
      JOIN musteriler m ON m.id = s.musteri_id
      JOIN urunler u ON u.id = s.urun_id
      WHERE s.guncellendi > :sql_last_value
      ORDER BY s.guncellendi"
    use_column_value => true
    tracking_column => "guncellendi"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/sql_last_value.yml"
    schedule => "*/10 * * * * *"                    # her 10 saniyede bir
  }
}

filter {
  mutate { remove_field => ["@version", "event"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${LS_USER}"
    password => "${LS_PASSWORD}"
    index => "mysql-siparisler"
    document_id => "%{siparis_id}"                  # ayni siparis tekrar gelirse belge guncellenir
    manage_template => false
  }
}
