# Benchmark: aynı satır N kez üretilir ve aynı alanlar grok (regex) ile ayrıştırılır.
input {
  generator {
    lines => ['2026-11-02 10:14:02 [ERROR] database-proxy: {"error":"Connection pool exhausted","active_conns":100}']
    count => "${BENCH_COUNT:200000}"
  }
}
filter {
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:ts} \[%{LOGLEVEL:loglevel}\] %{NOTSPACE:service}: %{GREEDYDATA:rest_msg}$" }
  }
}
output { }
