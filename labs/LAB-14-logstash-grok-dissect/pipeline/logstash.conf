# ==============================================================================
# LAB-14 ana pipeline
#   input  : ham log satirlari (TCP 5000)
#   filter : grok (ayristirma) -> date -> json -> mutate
#   output : kosullu yonlendirme (hata / normal / ayristirilamayan)
# ==============================================================================

input {
  tcp {
    id => "tcp_raw_logs"
    port => 5000
    codec => line        # her TCP satiri bir olay
  }
}

filter {
  # --------------------------------------------------------------------------
  # 1) GROK: ham metni alanlara ayirir. "match" bir LISTE alir; Logstash
  #    desenleri sirayla dener ve ilk eslesende durur. Boylece tek filtre
  #    birden fazla log formatini yakalar.
  #      1. desen -> 2026-11-02 10:14:02 [ERROR] payment-gateway: mesaj
  #      2. desen -> 2026-11-02 10:14:31 ERROR legacy-batch - mesaj
  #    Hicbiri eslesmezse olay "_grokparsefailure" etiketi alir, silinmez.
  # --------------------------------------------------------------------------
  grok {
    id => "grok_app_log"
    match => {
      "message" => [
        "^%{TIMESTAMP_ISO8601:ts} \[%{LOGLEVEL:loglevel}\] %{NOTSPACE:service}: %{GREEDYDATA:rest_msg}$",
        "^%{TIMESTAMP_ISO8601:ts} %{LOGLEVEL:loglevel} %{NOTSPACE:service} - %{GREEDYDATA:rest_msg}$"
      ]
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  # Ayristirilamayan satirlarda alanlar yok; asagidaki filtreleri calistirmak
  # anlamsiz ve yanlis etiket uretir. Bu yuzden hepsi tek kosula alinmistir.
  if "_grokparsefailure" not in [tags] {

    # ------------------------------------------------------------------------
    # 2) DATE: logun kendi saatini @timestamp'e tasir. Index adi da buradan
    #    turedigi icin veri, geldigi saate degil OLUSTUGU saate yazilir.
    # ------------------------------------------------------------------------
    date {
      id => "date_event_time"
      match => [ "ts", "yyyy-MM-dd HH:mm:ss" ]
      timezone => "UTC"
      target => "@timestamp"
      remove_field => [ "ts" ]
    }

    # ------------------------------------------------------------------------
    # 3) JSON: mesaj govdesi JSON ise alt alanlara acilir (payload.*).
    #    Duz metin mesajlarda bu filtre atlanir.
    # ------------------------------------------------------------------------
    if [rest_msg] =~ /^\{.*\}$/ {
      json {
        id => "json_payload"
        source => "rest_msg"
        target => "payload"
      }
    }

    # ------------------------------------------------------------------------
    # 4) MUTATE: standartlastirma. Seviye kucuk harfe cevrilir (ERROR/error
    #    ayrimi kalksin), ortam etiketi eklenir.
    # ------------------------------------------------------------------------
    mutate {
      id => "normalize_fields"
      lowercase => [ "loglevel" ]
      add_field => { "env" => "production" }
    }
  }
}

output {
  # --------------------------------------------------------------------------
  # 5) KOSULLU YONLENDIRME: ayni hat uc ayri hedefe yazar.
  #    - ayristirilamayanlar karantinaya (incelenecek)
  #    - hatalar ayri index'e (operasyon tek yerden bakar)
  #    - geri kalani uygulama index'ine
  # --------------------------------------------------------------------------
  if "_grokparsefailure" in [tags] {
    elasticsearch {
      id => "es_out_unparsed"
      hosts => ["${ES_HOST}"]
      index => "grok-unparsed-%{+YYYY.MM.dd}"
      user => "${ES_USER}"
      password => "${ELASTIC_PASSWORD}"
    }
  } else if [loglevel] == "error" {
    elasticsearch {
      id => "es_out_error"
      hosts => ["${ES_HOST}"]
      index => "grok-error-%{+YYYY.MM.dd}"
      user => "${ES_USER}"
      password => "${ELASTIC_PASSWORD}"
    }
  } else {
    elasticsearch {
      id => "es_out_app"
      hosts => ["${ES_HOST}"]
      index => "grok-app-%{+YYYY.MM.dd}"
      user => "${ES_USER}"
      password => "${ELASTIC_PASSWORD}"
    }
  }
}
