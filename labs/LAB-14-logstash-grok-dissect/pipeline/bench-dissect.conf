# Benchmark: aynı satır N kez üretilir ve yalnızca dissect ile ayrıştırılır.
input {
  generator {
    lines => ['2026-11-02 10:14:02 [ERROR] database-proxy: {"error":"Connection pool exhausted","active_conns":100}']
    count => "${BENCH_COUNT:200000}"
  }
}
filter {
  dissect {
    mapping => { "message" => "%{ts} [%{loglevel}] %{service}: %{rest_msg}" }
  }
}
output { }
