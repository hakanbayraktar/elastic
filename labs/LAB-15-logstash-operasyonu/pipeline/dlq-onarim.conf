# dlq-onarim: ingest pipeline'inin DLQ'sunu okur, belgeyi onarip ops-app'e yeniden yazar.
input {
  dead_letter_queue {
    id => "dlq_okuyucu"
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "ingest"
    commit_offsets => true           # okunan konum diske yazilir; yeniden baslayinca tekrar okunmaz
    clean_consumed => true           # tamamen okunan DLQ dosyalari silinir
    sincedb_path => "/usr/share/logstash/data/dlq-onarim.sincedb"
  }
}

filter {
  # Red sebebi olayin govdesinde degil metadata'sinda gelir; kalici alana kopyalanir.
  mutate {
    id => "red_sebebi"
    add_field => { "[dlq][reason]" => "%{[@metadata][dead_letter_queue][reason]}" }
  }
  grok {
    id => "hata_tipi"
    match => { "[dlq][reason]" => '"type" => "%{WORD:[dlq][error_type]}"' }
    tag_on_failure => []
  }
  # Onarim: bu labda tek red sebebi sayi olmayan sure. Deger kaybolmasin diye metin alana tasinir.
  mutate {
    id => "onar"
    rename => { "response_time_ms" => "response_time_raw" }
    add_tag => [ "dlq_onarildi" ]
  }
}

output {
  elasticsearch {
    id => "es_onarilan"
    hosts => ["${ES_HOST}"]
    index => "ops-app"
    user => "${ES_USER}"
    password => "${ELASTIC_PASSWORD}"
    manage_template => false
  }
}
