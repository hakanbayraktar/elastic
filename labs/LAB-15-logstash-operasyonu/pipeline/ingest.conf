# ingest: uygulama olaylarini TCP'den alir, ops-app index'ine yazar.
input {
  tcp {
    id => "tcp_olaylar"
    port => 5000
    codec => json_lines              # her satir bir JSON olay
  }
}

filter {
  mutate {
    id => "temizle"
    remove_field => [ "@version", "event", "host", "port" ]
  }
}

output {
  elasticsearch {
    id => "es_ops_app"
    hosts => ["${ES_HOST}"]
    index => "ops-app"
    user => "${ES_USER}"
    password => "${ELASTIC_PASSWORD}"
    manage_template => false
  }
}
