input {
  file {
    path => "/data/satislar.csv"
    mode => "read"                                  # dosyayi bastan sona bir kez oku
    file_completed_action => "log"                  # varsayilan "delete" dosyayi siler
    file_completed_log_path => "/usr/share/logstash/data/okunan-dosyalar.log"
    sincedb_path => "/usr/share/logstash/data/sincedb-excel"
  }
}

filter {
  csv {
    separator => ";"
    columns => ["fatura_no", "tarih", "musteri", "il", "urun", "adet", "birim_fiyat", "tutar"]
  }
  # Excel'in baslik satiri da bir satirdir: belge olmasin.
  if [fatura_no] == "Fatura No" { drop {} }

  # 1.234,50 -> 1234.50 : once binlik noktalar silinir, sonra ondalik virgul noktaya cevrilir.
  mutate { gsub => ["birim_fiyat", "\.", "", "tutar", "\.", ""] }
  mutate { gsub => ["birim_fiyat", ",", ".", "tutar", ",", "."] }
  mutate { convert => { "adet" => "integer" "birim_fiyat" => "float" "tutar" => "float" } }

  # gg.aa.yyyy -> @timestamp
  date {
    match => ["tarih", "dd.MM.yyyy"]
    timezone => "Europe/Istanbul"
  }

  mutate { remove_field => ["message", "event", "log", "host", "@version"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    user => "${LS_USER}"
    password => "${LS_PASSWORD}"
    index => "excel-satislar"
    document_id => "%{fatura_no}"                   # ayni dosya tekrar okunursa kopya belge olusmaz
    manage_template => false                        # sablonu biz kurduk; kullanicinin yetkisi de yok
  }
}
