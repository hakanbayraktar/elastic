apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
  labels:
    app: filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    app: filebeat
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
  labels:
    app: filebeat
data:
  filebeat.yml: |-
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs
        enabled: true
        paths:
          - /var/log/containers/*.log
        prospector.scanner.symlinks: true
        parsers:
          - container:
              stream: all
              format: auto
          - multiline:
              type: pattern
              # Yeni bir olayın İLK satırını tanıyan desen. Uygulama satırları
              # "[2026-11-11 21:49:47] ERROR ..." biçiminde, yani köşeli parantezle
              # başlar; parantez isteğe bağlı tutularak tarihle başlayan biçim de
              # desteklenir.
              #
              # DİKKAT: YAML tek tırnak içinde ters bölü bir kaçış karakteri DEĞİLDİR.
              # '\\[' yazmak Filebeat'e "ters bölü ara" diyen bir regex gönderir;
              # o zaman hiçbir satır desene uymaz, negate: true yüzünden her satır
              # devam satırı sayılır ve ilgisiz kayıtlar tek belgede birleşir.
              pattern: '^(\[)?[0-9]{4}-[0-9]{2}-[0-9]{2}'
              negate: true      # Desene UYMAYAN satırlar devam satırıdır
              match: after      # ve bir öncekinin ARDINA eklenir
              max_lines: 100
              timeout: 5s
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

    processors:
      - add_host_metadata: ~

    # Çıktı doğrudan Elasticsearch'edir. Pod'un içinden "localhost" host makineyi
    # DEĞİL pod'un kendisini gösterir; bu yüzden Kind ağının ağ geçidi IP'si
    # kullanılır ve DaemonSet'e ELASTICSEARCH_HOST ortam değişkeniyle geçilir.
    # Değeri setup-k8s-logging.sh otomatik hesaplar.
    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOST:http://172.18.0.1:9200}"]
      username: "${ELASTIC_USERNAME:elastic}"
      password: "${ELASTIC_PASSWORD:DevOps2026!}"
      index: "k8s-pod-logs"       # data stream; sablonu README Adim 2'de kurulur (replica 0)
      worker: 2
      bulk_max_size: 512

    setup.ilm.enabled: false
    setup.template.enabled: false   # sablonu Filebeat degil lab kurar

    logging.level: info
    logging.to_files: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.5.5
          args: [
            "-c", "/etc/filebeat.yml",
            "-e",
          ]
          env:
            # Kind node konteynerinden host'taki Elasticsearch'e giden adres.
            # setup-k8s-logging.sh bu değeri Kind ağının ağ geçidinden hesaplayıp
            # günceller; elle uygularsanız kendi değerinizi yazın.
            - name: ELASTICSEARCH_HOST
              value: "http://172.18.0.1:9200"
            - name: ELASTIC_USERNAME
              value: "elastic"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: password
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
          resources:
            limits:
              memory: 200Mi
              cpu: 200m
            requests:
              memory: 100Mi
              cpu: 100m
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              readOnly: true
              subPath: filebeat.yml
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            defaultMode: 0640
            name: filebeat-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
