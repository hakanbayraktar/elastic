# ADV-03 kind cluster'i: tek control-plane node. Pod loglari node konteynerinin /var/log/containers dizinine
# yazilir; Filebeat DaemonSet onlari oradan okur. Disariya port acmaz.
#   kind create cluster --config kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-loglar
nodes:
  - role: control-plane
