# ADV-09 kind cluster'i. NodePort servisleri normalde yalniz node container'inin Docker IP'sinde acilir ve bu IP
# cluster yeniden kurulunca degisir. extraPortMappings node'un portunu host'un loopback'ine baglar: Kibana her zaman
# 127.0.0.1:30086, Elasticsearch 127.0.0.1:30087. Esleme yalniz cluster OLUSTURULURKEN tanimlanabilir.
#   kind create cluster --config kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-eck
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30086      # ECK Kibana
        hostPort: 30086
        listenAddress: "127.0.0.1"   # disari acilmaz; erisim SSH tuneliyle
        protocol: TCP
      - containerPort: 30087      # ECK Elasticsearch
        hostPort: 30087
        listenAddress: "127.0.0.1"
        protocol: TCP
