name: fastapi-elk-monitoring

services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-elk-observability:latest
    container_name: fastapi-observability-app2
    environment:
      - HOST=0.0.0.0
      - PORT=19002
      - LOGSTASH_HOST=logstash-app2
      - LOGSTASH_PORT=5000
      - LOG_LEVEL=INFO
      - SERVICE_NAME=fastapi-order-service
      - ENVIRONMENT=production
    ports:
      # Port 19002 (App2 slotu - Nginx ve doğrudan PIP erişimi)
      - "0.0.0.0:19002:19002"
    depends_on:
      - logstash
    networks:
      - default
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    container_name: logstash-app2
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - ES_HOST=${ES_HOST:-http://elasticsearch-lab00:9200}
      - ES_USER=${ES_USER:-elastic}
      - ES_PWD=${ES_PWD:-DevOps2026!}
    ports:
      # Logstash TCP portu: uygulama Docker ağı üzerinden logstash-app2:5000'e yazar.
      # Host'a yalnızca elle nc testi için, loopback'te ve LAB-06'nın 5000 portuyla
      # çakışmayacak şekilde 5010 olarak açılır.
      - "127.0.0.1:5010:5000"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: elastic-lab00_default
    external: true
