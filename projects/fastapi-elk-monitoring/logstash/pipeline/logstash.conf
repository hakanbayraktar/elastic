input {
  tcp {
    port => 5000
    codec => json_lines
    tags => ["fastapi_source"]
  }
}

filter {
  # 1. ISO8601 Zaman Damgası Eşleme (@timestamp)
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => [ "timestamp" ]
    }
  }

  # 2. Hata Seviyesi ve 5xx Yanıt Tespiti (Etiketleme)
  # Dikkat: Logstash 9'da OLMAYAN bir alanı sayıyla karşılaştırmak (null >= 500) olayı
  # "Unexpected conditional input combination ... Event was dropped" uyarısıyla DÜŞÜRÜR.
  # Bu yüzden önce alanın varlığı kontrol edilir, karşılaştırma iç blokta yapılır.
  if [log][level] == "ERROR" {
    mutate { add_tag => [ "application_error" ] }
  } else if [http][response][status_code] {
    if [http][response][status_code] >= 500 {
      mutate { add_tag => [ "application_error" ] }
    }
  } else if [http][status_code] {
    if [http][status_code] >= 500 {
      mutate { add_tag => [ "application_error" ] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST:http://elasticsearch-lab00:9200}"]
    user => "${ES_USER:elastic}"
    password => "${ES_PWD:DevOps2026!}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "fastapi"
    data_stream_namespace => "production"
  }

  # Hata durumlarında stdout çıktısı vererek docker loglarında anlık görünürlük sağla
  if "application_error" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}
