input {
  beats {
    port => 5044
    # Logstash 9.x: eski `ssl => true` kaldirildi; TLS `ssl_enabled` ile acilir.
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    # Beats girdisi PKCS#8 anahtar ister (setup-certs.sh donusturur)
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pk8"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    # optional: istemci sertifikasi gonderirse CA'ya karsi dogrulanir (mTLS);
    # required yapilirsa sertifikasiz Beat baglanamaz.
    ssl_client_authentication => "optional"
  }
}

filter {
  mutate {
    add_field => {
      "[tls][channel]" => "beats-to-logstash-mtls"
      "[environment]" => "devsecops-prod"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    # Logstash 9.x: `ssl` ve `cacert` kaldirildi -> ssl_enabled + ssl_certificate_authorities
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "devsecops-%{+YYYY.MM.dd}"
  }
}
