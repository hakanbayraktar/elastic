packetbeat.interfaces.device: any

packetbeat.protocols:
  - type: dns
    ports: [53]
    include_authorities: true
    include_additionals: true

  - type: http
    ports: [80, 8080, 9200, 5601]

# Packetbeat network_mode: host ile calisir; Docker ag adlari (elasticsearch) host'ta
# cozulmez. ES'in loopback portu kullanilir (sertifika SAN'inda localhost var).
output.elasticsearch:
  hosts: ["https://localhost:9201"]
  ssl.enabled: true
  ssl.certificate_authorities: ["/etc/certs/ca/ca.crt"]
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"
