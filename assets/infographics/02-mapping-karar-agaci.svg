<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><style>.t{font-family:Arial,sans-serif;fill:#172b4d}.h{font-size:34px;font-weight:bold}.b{font-size:22px}.s{font-size:18px}.box{fill:#fff;stroke:#0b6e99;stroke-width:3}.a{stroke:#0b6e99;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#0b6e99"/></marker></defs><rect width="1400" height="620" fill="#f7fafc"/><text x="65" y="70" class="t h">Mapping kararı: Alanı nasıl kullanacaksın?</text><text x="65" y="108" class="t b">Her alanın tipi, gelecekteki sorgu ve dashboard ihtiyacına göre seçilir.</text><rect x="70" y="180" width="270" height="280" rx="16" class="box"/><text x="105" y="235" class="t b">İnsan cümlesi mi?</text><text x="105" y="278" class="t s">Örnek: message</text><text x="105" y="325" class="t b">text</text><text x="105" y="365" class="t s">Analyzer ile ara</text><text x="105" y="400" class="t s">Gerekirse .keyword ekle</text><rect x="565" y="180" width="270" height="280" rx="16" class="box"/><text x="600" y="235" class="t b">Tam değer mi?</text><text x="600" y="278" class="t s">service.name, trace.id</text><text x="600" y="325" class="t b">keyword</text><text x="600" y="365" class="t s">Filter, sort, terms agg</text><rect x="1060" y="180" width="270" height="280" rx="16" class="box"/><text x="1095" y="235" class="t b">Özel veri türü mü?</text><text x="1095" y="278" class="t s">IP, zaman, sayı, konum</text><text x="1095" y="325" class="t b">ip / date / long</text><text x="1095" y="365" class="t s">range, histogram, geo</text><path d="M340 320H550" class="a"/><path d="M835 320H1045" class="a"/><text x="70" y="555" class="t b">Kritik kural: yanlış field type yerinde değişmez; yeni index + reindex gerekir.</text></svg>
