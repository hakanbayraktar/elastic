<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Elastic Stack eğitim veri akışı</title>
  <desc id="desc">Sentetik uygulama loglarının Logstash ile ECS alanlarına dönüştürülmesi, Elasticsearch'e yazılması ve Kibana ile analiz edilmesi akışını açıklayan iki boyutlu Türkçe infografik.</desc>
  <style>
    .bg { fill:#f7fafc } .title { font:700 42px Arial,sans-serif; fill:#172b4d } .sub { font:400 21px Arial,sans-serif; fill:#42526e }
    .card { fill:#fff; stroke:#b3bac5; stroke-width:2 } .head { font:700 25px Arial,sans-serif; fill:#fff } .body { font:400 20px Arial,sans-serif; fill:#172b4d } .small { font:400 17px Arial,sans-serif; fill:#42526e }
    .step { font:700 19px Arial,sans-serif; fill:#fff } .arrow { stroke:#0b6e99; stroke-width:7; fill:none; marker-end:url(#arrow) }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6e99"/></marker></defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="80" y="85" class="title">Elastic Stack: Ham logdan operasyon kararına</text>
  <text x="80" y="123" class="sub">Bu akış, eğitimdeki her labın ortak modelidir: veriyi üret, yapılandır, ara/analiz et, sonra işlet.</text>

  <circle cx="122" cy="220" r="30" fill="#005571"/><text x="115" y="227" class="step">1</text>
  <rect x="80" y="270" rx="16" width="300" height="380" class="card"/>
  <rect x="80" y="270" rx="16" width="300" height="70" fill="#005571"/>
  <text x="112" y="315" class="head">Log kaynakları</text>
  <text x="112" y="385" class="body">• Proxy erişim logu</text><text x="112" y="425" class="body">• API uygulama logu</text><text x="112" y="465" class="body">• 5G olay kaydı</text>
  <text x="112" y="535" class="small">Örnek alanlar:</text><text x="112" y="570" class="small">timestamp, status, latency,</text><text x="112" y="600" class="small">client IP, trace id</text>
  <text x="112" y="625" class="small">Çıktı: NDJSON veya container logu</text>

  <circle cx="502" cy="220" r="30" fill="#0b6e99"/><text x="495" y="227" class="step">2</text>
  <rect x="460" y="270" rx="16" width="300" height="380" class="card"/>
  <rect x="460" y="270" rx="16" width="300" height="70" fill="#0b6e99"/>
  <text x="497" y="315" class="head">Topla ve dönüştür</text>
  <text x="492" y="385" class="body">Elastic Agent / Filebeat</text><text x="492" y="425" class="body">Logstash: grok veya dissect</text><text x="492" y="465" class="body">Ingest pipeline: convert,</text><text x="492" y="495" class="body">date, geoip, on_failure</text>
  <text x="492" y="555" class="small">Kural: alanları ECS'e eşle</text><text x="492" y="585" class="small">http.response.status_code</text><text x="492" y="615" class="small">event.duration, client.ip</text>

  <circle cx="882" cy="220" r="30" fill="#f5a700"/><text x="875" y="227" class="step">3</text>
  <rect x="840" y="270" rx="16" width="300" height="380" class="card"/>
  <rect x="840" y="270" rx="16" width="300" height="70" fill="#f5a700"/>
  <text x="875" y="315" class="head">Elasticsearch</text>
  <text x="872" y="385" class="body">Mapping: doğru field type</text><text x="872" y="425" class="body">Index / data stream</text><text x="872" y="465" class="body">ILM: rollover → delete</text>
  <text x="872" y="540" class="small">Örnek hedef:</text><text x="872" y="570" class="small">logs-telecom.app-prod</text><text x="872" y="610" class="small">Çıktı: aranabilir, yönetilen veri</text>

  <circle cx="1262" cy="220" r="30" fill="#6b5b95"/><text x="1255" y="227" class="step">4</text>
  <rect x="1220" y="270" rx="16" width="300" height="380" class="card"/>
  <rect x="1220" y="270" rx="16" width="300" height="70" fill="#6b5b95"/>
  <text x="1283" y="315" class="head">Kibana ile karar</text>
  <text x="1252" y="385" class="body">Discover: olay inceleme</text><text x="1252" y="425" class="body">Dev Tools: Query DSL</text><text x="1252" y="465" class="body">Lens: p95 ve hata oranı</text><text x="1252" y="505" class="body">Alert: eşik ihlali</text>
  <text x="1252" y="585" class="small">Çıktı: kanıtlanabilir</text><text x="1252" y="615" class="small">operasyon aksiyonu</text>
  <path class="arrow" d="M380 460 H450"/><path class="arrow" d="M760 460 H830"/><path class="arrow" d="M1140 460 H1210"/>
</svg>
