<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Logstash pipeline ve grok ayrıştırma mimarisi</title>
  <desc id="desc">Ham log satırlarının TCP girdisiyle Logstash'e gelmesi, grok ile iki farklı formatın ayrıştırılması, date/json/mutate ile zenginleştirilmesi, koşullu yönlendirme ile üç ayrı Elasticsearch index'ine yazılması ve Kibana panosunda raporlanmasını gösteren Türkçe mimari diyagram.</desc>
  <style>
    .bg { fill:#f7fafc }
    .title { font:700 40px Arial,sans-serif; fill:#172b4d }
    .sub { font:400 21px Arial,sans-serif; fill:#42526e }
    .card { fill:#fff; stroke:#b3bac5; stroke-width:2 }
    .head { font:700 24px Arial,sans-serif; fill:#fff }
    .body { font:400 20px Arial,sans-serif; fill:#172b4d }
    .mono { font:400 17px "Courier New",monospace; fill:#172b4d }
    .monos { font:400 15px "Courier New",monospace; fill:#42526e }
    .small { font:400 17px Arial,sans-serif; fill:#42526e }
    .step { font:700 19px Arial,sans-serif; fill:#fff }
    .arrow { stroke:#0b6e99; stroke-width:7; fill:none; marker-end:url(#arrow) }
    .arrowq { stroke:#8a94a6; stroke-width:4; fill:none; stroke-dasharray:9 7; marker-end:url(#arrowg) }
    .badge { font:700 17px Arial,sans-serif; fill:#fff }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6e99"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a94a6"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>

  <text x="60" y="78" class="title">Logstash: ham log satırından ayrıştırılmış veriye</text>
  <text x="60" y="116" class="sub">Tek bir hat; üç aşama (input → filter → output), iki log formatı, üç hedef index ve bir Kibana panosu.</text>

  <!-- 1. Kaynaklar -->
  <circle cx="102" cy="176" r="28" fill="#005571"/><text x="95" y="183" class="step">1</text>
  <rect x="60" y="220" rx="16" width="330" height="430" class="card"/>
  <rect x="60" y="220" rx="16" width="330" height="64" fill="#005571"/>
  <text x="88" y="262" class="head">Ham log satırları</text>
  <text x="88" y="320" class="body">Girdi: TCP 5000</text>
  <text x="88" y="356" class="small">Aynı sistemde iki farklı format:</text>
  <text x="88" y="392" class="monos">2026-11-02 10:14:09</text>
  <text x="88" y="414" class="monos">[ERROR] payment-gateway:</text>
  <text x="88" y="436" class="monos">{"error":"timeout", ...}</text>
  <text x="88" y="480" class="monos">2026-11-02 10:14:31</text>
  <text x="88" y="502" class="monos">ERROR legacy-batch -</text>
  <text x="88" y="524" class="monos">nightly job failed</text>
  <text x="88" y="568" class="small">Bir de düzeni bozuk satır:</text>
  <text x="88" y="600" class="monos">bozuk satir: seviye yok</text>
  <text x="88" y="630" class="small">Hiçbiri silinmeyecek.</text>

  <!-- 2. Logstash -->
  <circle cx="487" cy="176" r="28" fill="#0b6e99"/><text x="480" y="183" class="step">2</text>
  <rect x="445" y="220" rx="16" width="330" height="430" class="card"/>
  <rect x="445" y="220" rx="16" width="330" height="64" fill="#0b6e99"/>
  <text x="473" y="262" class="head">Logstash pipeline</text>
  <rect x="470" y="305" rx="8" width="280" height="44" fill="#eef4f8" stroke="#b3bac5"/>
  <text x="486" y="334" class="mono">input { tcp { 5000 } }</text>
  <rect x="470" y="361" rx="8" width="280" height="196" fill="#eef4f8" stroke="#b3bac5"/>
  <text x="486" y="390" class="mono">filter {</text>
  <text x="498" y="416" class="mono">grok   # 2 desen</text>
  <text x="498" y="440" class="mono">date   # → @timestamp</text>
  <text x="498" y="464" class="mono">json   # payload.*</text>
  <text x="498" y="488" class="mono">mutate # küçük harf</text>
  <text x="486" y="514" class="mono">}</text>
  <text x="498" y="542" class="monos">uymazsa: _grokparsefailure</text>
  <rect x="470" y="569" rx="8" width="280" height="44" fill="#eef4f8" stroke="#b3bac5"/>
  <text x="486" y="598" class="mono">output { if / else }</text>
  <text x="473" y="636" class="small">Sayaçlar: :9600 API (matches / failures)</text>

  <!-- 3. Hedef index'ler -->
  <circle cx="872" cy="176" r="28" fill="#f5a700"/><text x="865" y="183" class="step">3</text>
  <rect x="830" y="220" rx="16" width="330" height="430" class="card"/>
  <rect x="830" y="220" rx="16" width="330" height="64" fill="#f5a700"/>
  <text x="858" y="262" class="head">Koşullu yönlendirme</text>
  <rect x="855" y="310" rx="10" width="280" height="86" fill="#fff4de" stroke="#f5a700" stroke-width="2"/>
  <text x="872" y="342" class="mono">grok-error-*</text>
  <text x="872" y="372" class="small">loglevel == "error"</text>
  <rect x="855" y="412" rx="10" width="280" height="86" fill="#eaf5ea" stroke="#5aa454" stroke-width="2"/>
  <text x="872" y="444" class="mono">grok-app-*</text>
  <text x="872" y="474" class="small">info / warn olayları</text>
  <rect x="855" y="514" rx="10" width="280" height="86" fill="#fdeaea" stroke="#bd271e" stroke-width="2"/>
  <text x="872" y="546" class="mono">grok-unparsed-*</text>
  <text x="872" y="576" class="small">karantina: _grokparsefailure</text>
  <text x="858" y="630" class="small">Index tarihi olayın kendi saatinden</text>

  <!-- 4. Kibana -->
  <circle cx="1257" cy="176" r="28" fill="#6b5b95"/><text x="1250" y="183" class="step">4</text>
  <rect x="1215" y="220" rx="16" width="330" height="430" class="card"/>
  <rect x="1215" y="220" rx="16" width="330" height="64" fill="#6b5b95"/>
  <text x="1243" y="262" class="head">Kibana panosu</text>
  <text x="1243" y="320" class="body">data view: grok-*</text>
  <text x="1243" y="360" class="small">• Ayrıştırılan / ayrıştırılamayan</text>
  <text x="1259" y="392" class="small">olay sayısı (sağlık göstergesi)</text>
  <text x="1243" y="432" class="small">• Servis bazında hata sayısı</text>
  <text x="1243" y="472" class="small">• Zaman içinde seviye dağılımı</text>
  <text x="1243" y="512" class="small">• Servis bazında p95 yanıt süresi</text>
  <text x="1243" y="568" class="small">Discover'da aynı veri:</text>
  <text x="1243" y="600" class="monos">loglevel : "error"</text>
  <text x="1243" y="630" class="small">Operasyon buradan karar verir.</text>

  <path class="arrow" d="M395,435 L440,435"/>
  <path class="arrow" d="M780,435 L825,435"/>
  <path class="arrow" d="M1165,435 L1210,435"/>

  <!-- Alt bant: grok vs dissect -->
  <rect x="60" y="700" rx="16" width="1485" height="240" fill="#fff" stroke="#b3bac5" stroke-width="2"/>
  <rect x="60" y="700" rx="16" width="1485" height="56" fill="#172b4d"/>
  <text x="88" y="738" class="head">Hangi filtre? grok mu, dissect mi?</text>

  <rect x="88" y="786" rx="10" width="440" height="130" fill="#eef4f8" stroke="#0b6e99" stroke-width="2"/>
  <text x="108" y="820" class="body">grok — regex motoru</text>
  <text x="108" y="852" class="small">Esnek: tek filtrede birden çok format,</text>
  <text x="108" y="878" class="small">opsiyonel alanlar, değişken düzen.</text>
  <text x="108" y="904" class="small">Bedeli: CPU.</text>

  <rect x="558" y="786" rx="10" width="440" height="130" fill="#eaf5ea" stroke="#5aa454" stroke-width="2"/>
  <text x="578" y="820" class="body">dissect — ayraç tabanlı</text>
  <text x="578" y="852" class="small">Regex yok, sadece ayraçlara göre dilimler.</text>
  <text x="578" y="878" class="small">Çok hızlı ama düzen birebir tutmalı;</text>
  <text x="578" y="904" class="small">tutmazsa _dissectfailure.</text>

  <rect x="1028" y="786" rx="10" width="489" height="130" fill="#fff4de" stroke="#f5a700" stroke-width="2"/>
  <text x="1048" y="820" class="body">Karar kuralı</text>
  <text x="1048" y="852" class="small">Tek ve sabit formatlı yüksek hacim → dissect.</text>
  <text x="1048" y="878" class="small">Karışık/değişken format → grok.</text>
  <text x="1048" y="904" class="small">Ölçüm (300k olay): grok olay başına 16–66 µs daha pahalı.</text>
</svg>
