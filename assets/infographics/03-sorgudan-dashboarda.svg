<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><style>.t{font-family:Arial,sans-serif;fill:#172b4d}.h{font-size:34px;font-weight:bold}.b{font-size:22px}.s{font-size:18px}.box{fill:#fff;stroke:#6b5b95;stroke-width:3}.a{stroke:#6b5b95;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#6b5b95"/></marker></defs><rect width="1400" height="620" fill="#f7fafc"/><text x="65" y="70" class="t h">Operasyon sorusu → Query DSL → Dashboard → Alert</text><rect x="70" y="175" width="280" height="290" rx="16" class="box"/><text x="100" y="235" class="t b">1. Soru</text><text x="100" y="285" class="t s">“5xx nerede arttı?”</text><text x="100" y="330" class="t s">Zaman aralığını tanımla</text><text x="100" y="365" class="t s">Servisi/endpoint'i seç</text><rect x="560" y="175" width="280" height="290" rx="16" class="box"/><text x="590" y="235" class="t b">2. Sorgu</text><text x="590" y="285" class="t s">bool.filter + range</text><text x="590" y="330" class="t s">date_histogram</text><text x="590" y="365" class="t s">percentiles (p95)</text><rect x="1050" y="175" width="280" height="290" rx="16" class="box"/><text x="1080" y="235" class="t b">3. Aksiyon</text><text x="1080" y="285" class="t s">Lens paneli oluştur</text><text x="1080" y="330" class="t s">%5 eşiğiyle alert ver</text><text x="1080" y="365" class="t s">Discover drilldown aç</text><path d="M350 320H545" class="a"/><path d="M840 320H1035" class="a"/><text x="70" y="550" class="t b">Dashboard görsel değil karar aracıdır: her panel tek, açık bir operasyon sorusunu yanıtlar.</text></svg>
