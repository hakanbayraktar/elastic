<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
 <title id="title">Yanlış mapping, reindex ve atomik alias geçişi</title><desc id="desc">Metin status alanı yeni indexte short olarak tanımlanır. Reindex değerleri dönüştürür, doğrulama yapılır ve read alias aynı istekte yeni indexe taşınır.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#176b87"/></marker></defs>
 <rect width="1400" height="650" fill="#f5f8fc"/>
 <g font-family="Arial,sans-serif" fill="#152c49"><text x="55" y="65" font-size="34" font-weight="bold">Alan tipi değişecekse yeni index oluştur</text><text x="55" y="108" font-size="23">Fiziksel index değişir; istemcinin kullandığı alias aynı kalır.</text></g>
 <g fill="white" stroke="#176b87" stroke-width="3"><rect x="55" y="180" width="360" height="220" rx="12"/><rect x="525" y="180" width="350" height="220" rx="12"/><rect x="985" y="180" width="360" height="220" rx="12"/></g>
 <g font-family="Arial,sans-serif" fill="#152c49" font-size="23"><text x="80" y="225" font-weight="bold">1. Kaynak: yanlış tip</text><text x="80" y="270">http_status → text/keyword</text><text x="80" y="310">"1000" ve "503" metindir.</text><text x="80" y="350">Metin range sonucu: 1</text><text x="550" y="225" font-weight="bold">2. Hedef: doğru tip</text><text x="550" y="270">http_status → short</text><text x="550" y="310">_reindex + tip dönüşümü</text><text x="550" y="350">failures: [] / created: 2</text><text x="1010" y="225" font-weight="bold">3. Doğrula ve geçir</text><text x="1010" y="270">Numeric range sonucu: 2</text><text x="1010" y="310">_aliases: remove + add</text><text x="1010" y="350">Okuma adresi aynı kalır.</text></g>
 <g stroke="#176b87" stroke-width="4" marker-end="url(#arrow)"><path d="M420 290H510"/><path d="M880 290H970"/></g>
 <g font-family="Arial,sans-serif" fill="#152c49"><text x="55" y="480" font-size="25" font-weight="bold">Kontrol: mapping + belge sayısı + iş sorgusu + alias hedefi</text><text x="55" y="530" font-size="23">Reindex yanıtının HTTP 200 olması tek başına veri doğruluğu kanıtı değildir.</text><text x="55" y="580" font-size="23">Canlı yazmalar için ayrıca geçiş planı gerekir; ilk gün sabit sentetik veriyle çalışılır.</text></g>
</svg>
