<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
 <title id="title">Yazma onayı, realtime GET ve search görünürlüğü</title><desc id="desc">Belge yazıldıktan sonra ID ile GET bulunabilir; search yeni refresh görünümünü bekler. Refresh snapshot veya flush değildir.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#176b87"/></marker></defs>
 <rect width="1400" height="620" fill="#f5f8fc"/>
 <g font-family="Arial,sans-serif" fill="#152c49"><text x="55" y="65" font-size="34" font-weight="bold">Yazma başarılı ≠ Search hemen görüyor</text><text x="55" y="110" font-size="23">GET by ID ile arama görünürlüğü farklı mekanizmalardır.</text></g>
 <g fill="white" stroke="#176b87" stroke-width="3"><rect x="55" y="190" width="330" height="200" rx="12"/><rect x="525" y="190" width="330" height="200" rx="12"/><rect x="995" y="190" width="350" height="200" rx="12"/></g>
 <g font-family="Arial,sans-serif" fill="#152c49" font-size="24"><text x="80" y="235" font-weight="bold">1. Belgeyi yaz</text><text x="80" y="280">PUT index/_doc/id</text><text x="80" y="320">Yazma yanıtı gelir.</text><text x="80" y="360">GET ID → found: true</text><text x="550" y="235" font-weight="bold">2. Henüz refresh yok</text><text x="550" y="280">_search eski görünümde</text><text x="550" y="320">Yeni kayıt görünmeyebilir.</text><text x="550" y="360">Demo: refresh_interval=-1</text><text x="1020" y="235" font-weight="bold">3. Refresh sonrası</text><text x="1020" y="280">POST index/_refresh</text><text x="1020" y="320">Yeni arama görünümü açılır.</text><text x="1020" y="360">_search → 1 kayıt</text></g>
 <g stroke="#176b87" stroke-width="4" marker-end="url(#arrow)"><path d="M390 290H510"/><path d="M860 290H980"/></g>
 <g font-family="Arial,sans-serif" fill="#152c49"><text x="55" y="475" font-size="24" font-weight="bold">Deney deterministik olmalı</text><text x="55" y="515" font-size="23">Ayrı demo indexinde otomatik refresh kapatılır; deney sonunda 1s ayarı geri verilir.</text><text x="55" y="565" font-size="23">Refresh arama görünürlüğüdür. Snapshot yedeklemesi veya flush ile aynı işlem değildir.</text></g>
</svg>
